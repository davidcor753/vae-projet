<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Benutzerverwaltung</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>

  <body>
    <h1>Benutzerverwaltung</h1>
    <p id="user-message"></p>

    <h2>Neuen Benutzer hinzufügen</h2>

    <!-- Formular zum Erstellen eines neuen Benutzers -->
    <form id="user-form">
      <label for="user-name">Benutzername:</label>
      <input type="text" id="user-name" required />

      <label for="user-password">Passwort:</label>
      <input type="password" id="user-password" required />

      <label for="user-role">Rolle:</label>
      <select id="user-role" required>
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit">Benutzer hinzufügen</button>
    </form>

    <h2>Benutzer</h2>
    <nav>
      <a href="index.html">Inventar</a>
      <a href="consultation.html">Historie</a>
      <a href="users.html">Benutzerverwaltung</a>
      <a href="/logout">Abmelden</a>
    </nav>
    <!-- Tabelle zur Anzeige der Benutzer -->
    <table id="users-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Rolle</th>
          <th>Aktionen</th>
        </tr>
      </thead>

      <tbody></tbody>
    </table>

    <script src="scripts/users.js"></script>
  </body>
</html>
